name: Build and push Docker image into registry

on:
  push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker image tag
      run: |
        IMAGE_NAME="${GITHUB_REPOSITORY}"
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          TAG="${GITHUB_REF_NAME}"
          echo "tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
        else
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '_' '-')
          echo "tags=${IMAGE_NAME}:${SAFE_BRANCH}" >> $GITHUB_OUTPUT
        fi
      id: docker-tag-setter

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.docker-tag-setter.outputs.tags }}
